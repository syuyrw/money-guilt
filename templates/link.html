<!DOCTYPE html>
<html>
<head>
    <title>Link Your Bank Account - Money Guilt</title>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" onload="window.PlaidLoaded=true"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .subtitle {
            color: #666;
            margin: 0 0 30px 0;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .message.show {
            display: block;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .debug {
            margin-top: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .debug-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 12px;
            color: #666;
        }
        .debug-log {
            font-family: monospace;
            font-size: 11px;
            color: #333;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .loading {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
            margin-left: 4px;
            animation: blink 1.3s infinite;
        }
        @keyframes blink {
            0%, 20%, 50%, 80%, 100% { opacity: 1; }
            40% { opacity: 0.2; }
            60% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Link Your Bank Account</h1>
        <p class="subtitle">Connect your bank to Money Guilt to track your spending habits</p>

        <button id="linkButton" onclick="openPlaidLink()">
            Connect Bank Account
        </button>

        <div id="message" class="message"></div>

        <div class="debug">
            <div class="debug-title">Debug Log</div>
            <div class="debug-log" id="debugLog">Initializing...</div>
        </div>
    </div>

    <script>
        const linkToken = "{{ link_token }}";
        const debugLog = document.getElementById('debugLog');
        let plaidHandler = null;

        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${msg}`;
            console.log(line);
            debugLog.textContent += line + '\n';
            debugLog.parentElement.scrollTop = debugLog.parentElement.scrollHeight;
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message show ${type}`;
        }

        log('Page loaded');
        log('Link Token: ' + linkToken);
        log('Plaid SDK loaded: ' + (typeof Plaid !== 'undefined'));

        if (!linkToken) {
            log('ERROR: No link token provided');
            document.getElementById('linkButton').disabled = true;
            showMessage('Error: No link token', 'error');
        } else {
            initPlaid();
        }

        function initPlaid() {
            log('Initializing Plaid Link...');

            if (typeof Plaid === 'undefined') {
                log('ERROR: Plaid not available yet, retrying...');
                setTimeout(initPlaid, 100);
                return;
            }

            const config = {
                token: linkToken,
                onLoad: () => {
                    log('Plaid Link loaded');
                },
                onSuccess: (publicToken, metadata) => {
                    log('Success! Public token received');
                    log('Metadata: ' + JSON.stringify(metadata));
                    exchangeToken(publicToken);
                },
                onExit: (err, metadata) => {
                    if (err) {
                        log('Exit with error: ' + err.error_code);
                        showMessage('Error: ' + err.error_message, 'error');
                    } else {
                        log('User exited Plaid Link');
                    }
                },
                onEvent: (eventName, metadata) => {
                    log('Event: ' + eventName);
                },
            };

            try {
                plaidHandler = Plaid.create(config);
                log('Plaid handler created successfully');
                document.getElementById('linkButton').disabled = false;
            } catch (err) {
                log('Exception creating Plaid: ' + err);
                showMessage('Error: ' + err, 'error');
            }
        }

        function openPlaidLink() {
            if (!plaidHandler) {
                log('Error: Plaid handler not initialized');
                showMessage('Error: Plaid not ready', 'error');
                return;
            }

            log('Opening Plaid Link modal...');
            showMessage('Opening Plaid Link<span class="loading"></span>', 'info');
            plaidHandler.open();
        }

        function exchangeToken(publicToken) {
            log('Exchanging public token for access token...');
            showMessage('Linking account<span class="loading"></span>', 'info');

            fetch('/api/exchange_token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ public_token: publicToken })
            })
            .then(response => response.json())
            .then(data => {
                log('Exchange response: ' + JSON.stringify(data));
                if (data.success) {
                    log('Access token: ' + data.access_token);
                    showMessage('✓ Account linked successfully!', 'success');
                    document.getElementById('linkButton').textContent = 'Account Linked ✓';
                    document.getElementById('linkButton').disabled = true;
                } else {
                    log('Exchange error: ' + data.error);
                    showMessage('Error: ' + data.error, 'error');
                }
            })
            .catch(err => {
                log('Fetch error: ' + err);
                showMessage('Error: ' + err.message, 'error');
            });
        }
    </script>
</body>
</html>
